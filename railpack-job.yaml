          -fsSL \"${ARCHIVE_URL}\" -o /tmp/archive.enc || { echo \"アーカイブのダウンロードに失敗しました（リンク失効の可能性があります）\";
          exit 1; }\n\n# ダウンロード結果のSHA256ハッシュを検証する（改竄・破損検知）\nACTUAL_SHA256=$(sha256sum
          /tmp/archive.enc | awk '{print $1}')\nif [ \"${ACTUAL_SHA256}\" != \"${ARCHIVE_SHA256_HEX}\"
          ]; then\n  echo \"SHA256ハッシュが一致しません（期待値: ${ARCHIVE_SHA256_HEX}, 実際: ${ACTUAL_SHA256}）\"\n
          \ exit 1\nfi\n\n# 先頭16byteをIVとして分離し、残りをciphertextとして復号する（iv || ciphertext
          形式）\ntail -c +17 /tmp/archive.enc > /tmp/archive.ciphertext\nIV_HEX=$(head
          -c 16 /tmp/archive.enc | xxd -p -c 16)\nopenssl enc -d -aes-256-cbc -K \"${ARCHIVE_ENC_KEY_HEX}\"
          -iv \"${IV_HEX}\" -in /tmp/archive.ciphertext -out /tmp/archive.raw || {
          echo \"復号に失敗しました\"; exit 1; }\n\n# マジックバイトでzip/tar.gzを判定して展開する\nif head
          -c 2 /tmp/archive.raw | grep -q \"PK\"; then\n  unzip -q /tmp/archive.raw
          -d /workspace/repo\nelse\n  tar -xzf /tmp/archive.raw -C /workspace/repo\nfi\nchmod
          -R 777 /workspace\n\n# 復号済み中間ファイルをコンテナ内に残さない\nrm -f /tmp/archive.enc /tmp/archive.ciphertext
          /tmp/archive.raw\n"
