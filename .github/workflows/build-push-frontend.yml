# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build & Push Frontend

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "frontend/**"
      - ".github/workflows/build-push-frontend.yml"

jobs:
  build-push:
    name: frontend イメージのビルド・push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: GitHub Container Registry にログイン
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: イメージのメタデータを生成
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/launchs-org/frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' }}
            type=sha,format=short,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}

      - name: Docker Buildx をセットアップ
        uses: docker/setup-buildx-action@v3

      - name: イメージをビルドして push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          target: release
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
