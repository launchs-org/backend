name: launchs-org

services:
  # リバースプロキシ
  nginx:
    image: nginx:latest
    ports:
      - "8955:8443"
    tty: true
    volumes:
      - ./nginx/configs:/etc/nginx/conf.d/
      - ./nginx/statics:/var/www/nginx/statics/:ro
      - ./nginx/keys:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx:rw
    restart: always
    depends_on:
      - frontend
      - handler
      - auth

  auth:
    hostname: auth
    image: ghcr.io/mattuu0/authbase/auth:v0.1.6
    tty: true
    env_file:
      - ./openssl/jwtKeys/private.env
      - ./config/auth.env
    volumes:
      - ./auth/icons:/assets/icons
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully

  # マイグレーション
  migrate:
    image: ghcr.io/mattuu0/authbase/auth:v0.1.6
    env_file:
      - ./config/auth.env
    command: ["/auth","migrate","-r"]
    depends_on:
      postgres:
        condition: service_healthy

  # フロントエンドのコンテナ
  frontend:
    hostname: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development-dependencies-env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    tty: true
    restart: always

  # handler コンテナ（旧 app）
  handler:
    hostname: app
    build:
      context: ./handler
      dockerfile: dockerfile
      target: Develop
    volumes:
      - ./handler/src:/app/src
      - ./shared:/shared
      - ~/.kube:/root/.kube:ro
    env_file:
      - ./config/app.env
      - ./openssl/jwtKeys/public.env
      - ./openssl/cliTokenKeys/private.env
      - ./openssl/cliTokenKeys/public.env
    environment:
      - TEMPORAL_HOST=temporal:7233
    tty: true
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

  # controller コンテナ（Temporal Worker: K8s 操作を担う）
  controller:
    hostname: controller
    build:
      context: ./controller
      dockerfile: dockerfile
      target: Develop
    volumes:
      - ./controller/src:/app/src
      - ./shared:/shared
      - ~/.kube:/root/.kube:ro
    env_file:
      - ./config/app.env
    environment:
      - TEMPORAL_HOST=temporal:7233
    tty: true
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

  # watcher コンテナ（K8s リソース状態監視）
  watcher:
    hostname: watcher
    build:
      context: ./watcher
      dockerfile: dockerfile
      target: Develop
    volumes:
      - ./watcher/src:/app/src
      - ./shared:/shared
      - ~/.kube:/root/.kube:ro
    env_file:
      - ./config/app.env
    tty: true
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

  # builder コンテナ（Temporal Worker: ビルド管理を担う）
  builder:
    hostname: builder
    build:
      context: ./builder
      dockerfile: dockerfile
      target: Develop
    volumes:
      - ./builder/src:/app/src
      - ./shared:/shared
      - ~/.kube:/root/.kube:ro
    env_file:
      - ./config/app.env
    environment:
      - TEMPORAL_HOST=temporal:7233
    tty: true
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    hostname: db
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: root
      TZ: Asia/Tokyo
    volumes:
      - dbdata:/var/lib/postgresql
      - ./database/script/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 10s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    ports:
      - 8088:8088
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@launchs.org
      - PGADMIN_DEFAULT_PASSWORD=password
      - PGADMIN_DISABLE_POSTFIX=1
      - PGADMIN_LISTEN_PORT=8088
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  dbdata:
    driver: local
