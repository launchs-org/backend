name: postgresql
description: "PostgreSQL データベーステンプレート"
image_url: bitnami/postgresql:latest
instance_size: small
replicas: 1
command: []
args: []

service:
  port: 5432
  target_port: 5432
  type: ClusterIP

env_vars:
  - key: POSTGRESQL_POSTGRES_PASSWORD
    auto_generate: true
    length: 32
    is_secret: true
  - key: POSTGRESQL_DATABASE
    value: app
    is_secret: false

volumes:
  - name: postgres-data
    size_mb: 3072
    mount_path: /bitnami/postgresql
