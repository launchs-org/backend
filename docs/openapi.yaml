    get:
      summary: 環境変数一覧取得
      description: |
        指定プロジェクトの環境変数一覧を返します。
        `is_secret: true` の変数は `value` が `***` にマスクされます。
      tags: [EnvVars]
      responses:
        "200":
          description: 環境変数一覧
          content:
            application/json:
              schema:
