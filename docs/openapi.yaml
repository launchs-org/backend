              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Webhook を削除しました"
        "403":
          description: アクセス権限なし
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Webhook が見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /webhooks/{deployment_id}/github:
    parameters:
      - name: deployment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: デプロイメント ID

    post:
      summary: GitHub Webhook 受信
      description: |
        GitHub からの push イベントを受信してビルドをトリガーします。

        **認証なし**（GitHub から直接呼ばれるため JWT 不要）。

        **シグネチャ検証**: `X-Hub-Signature-256` ヘッダーで HMAC-SHA256 検証を行います。
        Webhook 作成時に返された `secret` を使って GitHub 側で設定してください。

        **動作**: push イベントを受信すると、対象デプロイメントのブランチが一致する場合にビルドをトリガーします。
      tags: [Webhooks]
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
          description: |
            GitHub の HMAC-SHA256 シグネチャ（形式: `sha256=<hex>`）
          example: "sha256=abc123..."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ref:
                  type: string
                  description: プッシュ先ブランチ参照（例: `refs/heads/main`）
                  example: "refs/heads/main"
                after:
                  type: string
                  description: プッシュ後のコミット SHA
                  example: "abc123def456..."
                repository:
                  type: object
                  properties:
                    full_name:
                      type: string
                      description: リポジトリのフルネーム（`org/repo` 形式）
                      example: "org/repo"
      responses:
        "200":
          description: Webhook 受信成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Webhook を受信しました"
        "401":
          description: シグネチャ検証失敗
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: デプロイメントが見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

