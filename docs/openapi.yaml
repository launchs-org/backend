          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      summary: 環境変数作成
      description: |
        プロジェクトに環境変数を追加します。
        `is_secret: true` にすると値が k8s Secret に保存され、API 応答でマスクされます。
        環境変数はデプロイメントに EnvVarMount で紐づけた後、`apply` で k8s に反映されます。
      tags: [EnvVars]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvVarRequest"
            examples:
              plain:
                summary: 通常の環境変数
                value:
                  key: "APP_ENV"
                  value: "production"
                  is_secret: false
              secret:
                summary: シークレット
                value:
                  key: "DATABASE_URL"
                  value: "postgres://user:pass@host:5432/db"
                  is_secret: true
      responses:
        "201":
          description: 作成された環境変数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvVar"
        "400":
          description: バリデーションエラー
