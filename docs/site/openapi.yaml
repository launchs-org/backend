        "204":
          description: 削除成功
        "403":
          description: アクセス権限がありません
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: イメージが見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: このイメージは Deployment から参照されているため削除できません
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/images/{imageId}:
    parameters:
      - name: imageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: イメージ ID

    get:
      summary: イメージ取得
      tags: [Images]
      responses:
        "200":
          description: イメージ情報
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "403":
          description: アクセス権限がありません
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: イメージが見つからない
