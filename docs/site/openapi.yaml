        description: ビルド ID

    get:
      summary: ビルド取得
      description: |
        デプロイメントが削除済みの場合（`deployment_id` が null）は、Build レコードの
        `project_id` を経由して所有権を確認します。
      tags: [Builds]
      responses:
        "200":
          description: ビルド情報
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentBuild"
        "403":
          description: アクセスが禁止されています
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ビルドが見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      summary: ビルドキャンセル
      description: |
        実行中のビルドをキャンセルします。`status` が `pending` または `building` のビルドのみ
        キャンセル可能です。Temporal Workflow をキャンセルし k8s Job を削除します
        （`CancelBuildWorkflow` を起動）。
      tags: [Builds]
      responses:
        "200":
          description: キャンセル成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: "ビルドをキャンセルしました"
        "403":
          description: アクセスが禁止されています
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ビルドが見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: キャンセル不可能なステータス（succeeded/failed/cancelled）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/builds/{id}/logs:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ビルド ID

    get:
      summary: ビルドログ取得
      description: |
        ビルドのログを取得します。`since` パラメータで差分取得が可能です（ポーリング向け）。
      tags: [Builds]
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: |
            この日時以降のログのみ取得（RFC3339 形式、例: `2024-01-01T00:00:00Z`）。
            省略時は全ログを返します。パース失敗時は `400` エラー。
          example: "2024-01-01T00:00:00Z"
      responses:
        "200":
          description: ビルドログ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildLogsResponse"
        "400":
          description: since パラメータの形式不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: アクセスが禁止されています
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ビルドが見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ══════════════════════════════════════════════════════════════════
  # Images
  # ══════════════════════════════════════════════════════════════════
  /api/v1/projects/{id}/images:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
    get:
      summary: プロジェクト単位イメージ一覧取得
      description: |
        プロジェクトに紐づく Image レコード一覧を返します。ビルド成功時やイメージ URL 指定時に
        自動生成されるレコードで、Harbor に push されたイメージまたは外部イメージ URL を表します。
      tags: [Images]
      responses:
        "200":
          description: イメージ一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Image"
        "403":
          description: アクセス権限がありません
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: プロジェクトが見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/projects/{id}/images/{imageId}:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"
      - name: imageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
