  # ══════════════════════════════════════════════════════════════════
  # Builds
  # ══════════════════════════════════════════════════════════════════
  /api/v1/deployments/{id}/build:
    parameters:
      - $ref: "#/components/parameters/DeploymentIdParam"

    post:
      summary: ビルドトリガー
      description: |
        `railpack` / `archive` タイプのデプロイメントで Temporal `BuildWorkflow` を起動しビルドを開始します。

        **注意**: `dockerfile` タイプは現在サポートされていません（`400` が返ります）。

        - `railpack` タイプ: GitHub リポジトリ (`github_repo_url` 等) からビルドする既存フロー。
          `archive_upload_token` は指定しない。
        - `archive` タイプ: 事前に `POST /api/v1/deployments/{id}/build/upload` でアーカイブを
          アップロードして取得した `archive_upload_token` と、任意で `build_directory` を指定する。

        **前提条件**:
        - `type` が `railpack` または `archive` であること（`dockerfile` は非対応）
        - 別のビルドが実行中でないこと（`409` を返す）
        - `archive` タイプの場合、`archive_upload_token` が有効期限内（発行から15分）であること

        ビルドは k8s Job として実行されます。進捗は `GET /api/v1/builds/{id}/logs` で確認できます。
        成功すると Image レコードが自動作成され `pending_image_id` に設定されます。
      tags: [Builds]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerBuildRequest"
      responses:
        "201":
          description: 開始されたビルド情報
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentBuild"
        "400":
          description: dockerfile タイプは現在サポートされていません
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: アーカイブアップロードトークンが無効・期限切れです（archive タイプのみ）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: アクセスが禁止されています。またはアーカイブアップロードトークンの対象デプロイメントが一致しません（archive タイプのみ）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: デプロイメントが見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: ビルドが実行中（同時に複数のビルドは不可）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/deployments/{id}/build/upload:
    parameters:
      - $ref: "#/components/parameters/DeploymentIdParam"

    post:
      summary: ビルド用アーカイブアップロード
      description: |
        `archive` タイプのデプロイメント向けに zip/tar.gz アーカイブをアップロードします。
        この時点ではビルドは開始されません。

        処理の流れ:
        1. アップロードされたアーカイブの拡張子・マジックバイトを検証する（zip/tar.gz/tgzのみ許可）
        2. サーバー側で AES-256-CBC 暗号化し、暗号文を外部の一時ファイル共有サービス file.io に
           アップロードする（`expires=1h`, `maxDownloads=1` を明示指定し、ビルドJobが1回だけ
           ダウンロードすると自動的に無効化される）
        3. file.io のダウンロードリンク・復号鍵・暗号文のSHA256ハッシュ・ファイル名・サイズを
           クレームに含む有効期限15分のJWT（アップロードトークン）を発行して返す

        アーカイブ本体・復号鍵は DB には保存されない。取得した `upload_token` を
        `POST /api/v1/deployments/{id}/build` の `archive_upload_token` に渡してビルドを開始する。
        トークンは1回のビルド開始にのみ使用でき、再ビルド時は再アップロードが必要。

        **前提条件**:
        - `type` が `archive` であること（それ以外は `400` を返す）
        - アップロードするファイルサイズは概ね100MB程度まで（file.io無料枠の制限に合わせ
          リクエストボディ上限を120MBに設定している。超過時はEchoが自動的に `413` を返す）
      tags: [Builds]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archive]
              properties:
                archive:
                  type: string
                  format: binary
                  description: アップロードする zip/tar.gz/tgz アーカイブファイル
      responses:
        "200":
          description: アップロード完了。アップロードトークンを返す
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadBuildArchiveResponse"
        "400":
          description: archiveフィールドが指定されていない、拡張子・マジックバイトが不正、またはデプロイメントタイプが archive ではない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: アクセスが禁止されています
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: デプロイメントが見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: アップロードサイズが上限（120MB）を超えている
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: file.io へのアップロードに失敗しました
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

