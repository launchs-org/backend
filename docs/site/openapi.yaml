            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ══════════════════════════════════════════════════════════════════
  # Pod Logs
  # ══════════════════════════════════════════════════════════════════
  /api/v1/deployments/{id}/logs:
    parameters:
      - $ref: "#/components/parameters/DeploymentIdParam"

    get:
      summary: Pod ログ取得
      description: |
        デプロイメントの Pod ログを Pod ごとにグループ化して取得します。`since` パラメータで
        差分取得が可能です（ポーリング向け）。レスポンスの各 Pod エントリの `last_timestamp` を
        次回リクエストの `since` に使用してください。稼働中の Pod 名一覧は `active_pod_names` で、
        既に削除された Pod のログ履歴も `pods` 配列に残ります。
      tags: [Logs]
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: この日時以降のログのみ取得（RFC3339 形式）
          example: "2024-01-01T00:00:00Z"
      responses:
        "200":
          description: Pod ログ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodLogsResponse"
        "400":
          description: since パラメータの形式が不正（RFC3339 形式で指定してください）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: アクセス権限がありません
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: デプロイメントが見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ══════════════════════════════════════════════════════════════════
  # Metrics
  # ══════════════════════════════════════════════════════════════════
  /api/v1/deployments/{id}/metrics:
    parameters:
      - $ref: "#/components/parameters/DeploymentIdParam"

    get:
      summary: デプロイメントメトリクス取得
      description: |
        デプロイメントの CPU / メモリ使用量・レプリカ状態の時系列データを取得します
        （watcher サービスが定期収集）。
      tags: [Metrics]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 720
            minimum: 1
            maximum: 8640
          description: |
            取得件数の上限。デフォルト 720 件（30 秒間隔 × 720 件 = 過去1時間分）。
            最大 8640 件（過去3日分）で、それを超える値は自動的に上限値に丸められます。
            0 以下または非数値を指定すると `400` エラー。
      responses:
        "200":
          description: メトリクス一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentMetricsListResponse"
        "400":
          description: limit は正の整数で指定してください
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: アクセスが許可されていません
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: deployment が見つかりません
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ══════════════════════════════════════════════════════════════════
  # Webhooks
  # ══════════════════════════════════════════════════════════════════
  /api/v1/deployments/{id}/webhooks:
    parameters:
      - $ref: "#/components/parameters/DeploymentIdParam"

    post:
      summary: Webhook 作成
      description: |
        GitHub リポジトリの push イベント等を受け取るための Webhook を作成します。
        レスポンスの `secret` を控えておき、`POST /webhooks/{deployment_id}/*` 系エンドポイントの
        `X-Webhook-Secret` ヘッダーに使用してください（後から再取得はできません）。
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookRequest"
            example:
              github_repo_url: "https://github.com/org/repo"
      responses:
        "201":
          description: 作成された Webhook（secret を含む）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentWebhook"
        "400":
          description: リクエストが不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: アクセスが拒否されました
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: デプロイメントが見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      summary: Webhook 取得
      tags: [Webhooks]
      responses:
        "200":
          description: Webhook 情報
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentWebhook"
        "403":
          description: アクセスが拒否されました
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Webhook が見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/webhooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Webhook ID

    delete:
      summary: Webhook 削除
      tags: [Webhooks]
      responses:
        "200":
          description: 削除成功（`204` ではなくボディ付きで返却される点に注意）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: "削除しました"
        "403":
          description: アクセスが拒否されました
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Webhook が見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /webhooks/{deployment_id}/build:
    parameters:
      - name: deployment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: デプロイメント ID

    post:
      summary: シークレット認証でビルドをトリガー（外部 CI/CD 用）
      description: |
        JWT 認証は不要ですが、`X-Webhook-Secret` ヘッダーによるシークレット認証が必須です。
        GitHub Actions などの外部 CI/CD パイプラインから呼び出すことを想定しています。
        内部的には `POST /api/v1/deployments/{id}/build` と同じビルドロジックを実行します。
      tags: [Webhooks]
      security:
        - webhookSecret: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookTriggerBuildRequest"
      responses:
        "201":
          description: 開始されたビルド情報
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentBuild"
        "401":
          description: X-Webhook-Secret ヘッダーが未指定、またはシークレットが不正・Webhook が無効
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: リソースが見つかりません
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: ビルドが既に進行中、初回ビルド未完了、または Apply が既に進行中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 内部サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /webhooks/{deployment_id}/builds/{build_id}:
    parameters:
      - name: deployment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: デプロイメント ID
      - name: build_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ビルド ID

    get:
      summary: シークレット認証でビルド状態確認（外部 CI/CD 用）
      description: JWT 認証は不要ですが、`X-Webhook-Secret` ヘッダーによるシークレット認証が必須です。
      tags: [Webhooks]
      security:
        - webhookSecret: []
      responses:
        "200":
          description: ビルド情報
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentBuild"
        "401":
          description: X-Webhook-Secret ヘッダーが未指定、またはシークレットが不正・Webhook が無効
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: リソースが見つかりません
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 内部サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /webhooks/{deployment_id}/apply:
    parameters:
      - name: deployment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: デプロイメント ID

    post:
      summary: シークレット認証で Apply 実行（外部 CI/CD 用）
      description: |
        JWT 認証は不要ですが、`X-Webhook-Secret` ヘッダーによるシークレット認証が必須です。
        内部的には `POST /api/v1/deployments/{id}/apply` と同じ Apply ロジックを実行します。
      tags: [Webhooks]
      security:
        - webhookSecret: []
      responses:
        "200":
          description: Apply 結果（Workflow 起動済み。JWT 版は 202 を返すがこちらは 200 で統一されている点に注意）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyResult"
        "401":
          description: X-Webhook-Secret ヘッダーが未指定、またはシークレットが不正・Webhook が無効
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: リソースが見つかりません
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: ビルドが既に進行中、初回ビルド未完了、または Apply が既に進行中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 内部サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /webhooks/{deployment_id}/update-image:
    parameters:
      - name: deployment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: デプロイメント ID

    post:
      summary: シークレット認証でイメージ更新 & Apply（image_url タイプ専用）
      description: |
        JWT 認証は不要ですが、`X-Webhook-Secret` ヘッダーによるシークレット認証が必須です。
        指定した `image_url` に対応する Image レコードを解決（既存なら再利用、なければ新規作成）し、
        `pending_image_id` に設定した上で Apply を実行します。CI/CD からのイメージ更新デプロイに
        使用することを想定しています。
      tags: [Webhooks]
      security:
        - webhookSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookUpdateImageRequest"
            example:
              image_url: "registry.example.com/org/app:v1.2.3"
      responses:
        "200":
          description: Apply 結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyResult"
        "400":
          description: リクエストが不正、または image_url が空
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: X-Webhook-Secret ヘッダーが未指定、またはシークレットが不正・Webhook が無効
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: リソースが見つかりません
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: ビルドが既に進行中、初回ビルド未完了、または Apply が既に進行中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 内部サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ══════════════════════════════════════════════════════════════════
  # Environment Variables
  # ══════════════════════════════════════════════════════════════════
  /api/v1/projects/{id}/env-vars:
    parameters:
      - $ref: "#/components/parameters/ProjectIdParam"

    get:
      summary: 環境変数一覧取得
      description: |
        指定プロジェクトの環境変数一覧を返します。**注意**: `is_secret: true` の変数も
        `value` はマスクされずそのまま返却されます。
      tags: [EnvVars]
      responses:
        "200":
          description: 環境変数一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnvVar"
        "403":
          description: アクセスが拒否されました
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: プロジェクトが見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      summary: 環境変数作成
      description: |
        プロジェクトに環境変数を追加します。`is_secret: true` にすると値が k8s Secret に
        保存されます。環境変数はデプロイメントに EnvVarMount で紐づけた後、`apply` で k8s に
        反映されます。同一プロジェクト内で `key` が重複する場合は `409` を返します。
      tags: [EnvVars]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvVarRequest"
            examples:
              plain:
                summary: 通常の環境変数
                value:
                  key: "APP_ENV"
                  value: "production"
                  is_secret: false
              secret:
                summary: シークレット
                value:
                  key: "DATABASE_URL"
                  value: "postgres://user:pass@host:5432/db"
                  is_secret: true
      responses:
        "201":
          description: 作成された環境変数
          content:
