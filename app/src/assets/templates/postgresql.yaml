name: postgresql
description: "PostgreSQL データベーステンプレート"
image_url: postgres:16
instance_size: small
replicas: 1
command: []
args: []

service:
  port: 5432
  target_port: 5432
  type: ClusterIP

env_vars:
  - key: POSTGRES_PASSWORD
    auto_generate: true
    length: 32
    is_secret: true
  - key: POSTGRES_DB
    value: app
    is_secret: false
  - key: POSTGRES_USER
    value: postgres
    is_secret: false
  - key: PGDATA
    value: /var/lib/postgresql/data/pgdata
    is_secret: false

volumes:
  - name: postgres-data
    size_mb: 3072
    mount_path: /var/lib/postgresql/data
